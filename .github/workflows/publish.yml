
name: Publish OSRS price report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'osrs-price-monitor/docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload report
        uses: actions/upload-pages-artifact@v4
        with:
          path: osrs-price-monitor/docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
