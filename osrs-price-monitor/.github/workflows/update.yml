name: Update OSRS prices
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Europe/Oslo'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch price observations
        env:
          OSRS_USER_AGENT: 'PersonalOSRSPriceMonitor/1.0 (GitHub Actions; personal OSRS GE analysis)'
        run: python fetch_prices.py
      - name: Commit updated report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prices.json
          git diff --cached --quiet || (git commit -m 'Update OSRS market report' && git push)
